services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
      POSTGRES_DB: counter
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
      POSTGRES_DB: counter_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://counter:counter@db:5432/counter
      WEBHOOK_SECRET: dev-secret-change-me
      HOLD_SECONDS: "120"
      PORT: "3000"
      NODE_ENV: development
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  backend-test:
    build: ./backend
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgres://counter:counter@test-db:5432/counter_test
      DATABASE_URL: postgres://counter:counter@test-db:5432/counter_test
      WEBHOOK_SECRET: test-secret
      HOLD_SECONDS: "120"
      NODE_ENV: test
    depends_on:
      test-db: { condition: service_healthy }
    command: ["npm", "run", "test:e2e"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:3000
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata: